<!DOCTYPE html>
<html>

<head class="h-full bg-gray-900">
    <title>Faststock</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="./css/dx.material.purple.dark.css">
    <script type="text/javascript" src="./js/dx.all.js"></script>
    <script type="text/javascript">
        function getStart() {
            const URL = 'http://localhost:4000/api';
            const GRID_ID = '#grid';
            let currentEid = null;   // เก็บ eid จาก selectbox

            const ordersEvent = new DevExpress.data.CustomStore({
                key: 'pid',
                load() {
                    if (!currentEid) {
                        // ยังไม่เลือก Event → คืน array ว่าง
                        return $.Deferred().resolve([]).promise();
                    }
                    return sendRequest(`${URL}/prestock/byeid/${currentEid}`);
                },
                insert(values) {
                    if (!currentEid) {
                        return $.Deferred()
                        .reject('Please select Event first')
                        .promise();
                    }
                    values.eid = currentEid;
                    return sendRequest(`${URL}/prestock`, 'POST', values);
                },
                update(key, values) {
                    const grid  = $('#grid').dxDataGrid('instance');
                    const items = grid.getDataSource().items();
                    const old   = items.find(row => row.pid === key);

                    const eid = currentEid;
                    const pid = old.pid;

                    // รวมค่าจากเดิม + ที่แก้
                    const merged = { ...old, ...values };

                    // สร้าง body ใหม่ เฉพาะ field ที่ต้องการส่ง
                    const payload = {
                        order_quantity:     merged.order_quantity,
                        order_subquantity:  merged.order_subquantity,
                        real_quantity:      merged.real_quantity,
                        real_subquantity:   merged.real_subquantity,
                        psdate:             merged.psdate,
                        desc:               merged.desc,
                    };

                    return sendRequest(`${URL}/prestock/${eid}/${pid}`, 'PATCH', payload);
                },
                remove(key) {
                    const grid = $('#grid').dxDataGrid('instance');
                    const items = grid.getDataSource().items();
                    const row = items.find(r => r.pid === key);
                    const eid = row?.eid || currentEid;
                    const pid = key;

                    return sendRequest(`${URL}/prestock/${eid}/${pid}`, 'DELETE');
                },
            });

            const productStore = new DevExpress.data.CustomStore({
                key: 'pid',
                load() {
                    return sendRequest(`${URL}/products`);          // คืน result.data = array products
                },
                byKey(key) {
                    return sendRequest(`${URL}/products/${key}`);   // คืน product เดียว
                },
            });

            const eventToolbarStore = new DevExpress.data.CustomStore({
                key: 'eid',
                load() {
                    return sendRequest(`${URL}/event`);    // ให้ sendRequest คืน result.data
                },
            });

            $('#grid').dxDataGrid({
                dataSource: ordersEvent,
                repaintChangesOnly: false,
                showBorders: true,
                editing: {
                    refreshMode: 'reshape',
                    mode: 'popup',
                    allowAdding: true,
                    allowUpdating: true,
                    allowDeleting: true,
                    popup: {
                        title: 'Pre-Stock',
                        showTitle: true,
                        width: 800,
                        height: 600,
                    },
                    form: {
                        colCount: 2,
                        items: [{
                            itemType: 'group',
                            colSpan: 2,
                            colCount: 1,
                            items: [{
                                dataField: 'pid',
                                label: { text: 'Product' },
                                editorType: 'dxSelectBox',
                                editorOptions: {
                                    dataField: 'pid',
                                    label: { text: 'Product' },
                                    editorType: 'dxSelectBox',
                                    editorOptions: {
                                        dataSource: productStore,
                                        valueExpr: 'pid',
                                        displayExpr(item) {
                                        if (!item) return '';
                                        const { pname, category, vol, volunit, factor, subunit, unit } = item;
                                        return `${pname} (ประเภท: ${category}, ${vol ?? ''} ${volunit ?? ''}, ${factor ?? ''} ${subunit ?? ''} / ${unit ?? ''})`;
                                        },
                                        searchEnabled: true,
                                        // ไม่มี onValueChanged ก่อน ลองให้เลือกได้ก่อน
                                    },
                                },
                            }],
                        }, {
                            itemType: 'group',
                            colSpan: 2,
                            colCount: 2,
                            items: [
                                { dataField: 'order_quantity',    label: { text: 'Order (Tray/Box)'  }, editorType: 'dxNumberBox' },
                                { dataField: 'order_subquantity', label: { text: 'Order (เศษ)'}, editorType: 'dxNumberBox' },
                                { dataField: 'real_quantity',     label: { text: 'Real (Tray/Box)'     }, editorType: 'dxNumberBox' },
                                { dataField: 'real_subquantity',  label: { text: 'Real (เศษ)' }, editorType: 'dxNumberBox' },
                                {
                                dataField: 'psdate',
                                label: { text: 'Shipment' },
                                editorType: 'dxDateBox',
                                editorOptions: { type: 'date', displayFormat: 'dd-MM-yyyy' },
                                },
                                {
                                dataField: 'note',
                                label: { text: 'Note' },
                                editorType: 'dxTextBox',
                                colSpan: 2,                // textarea กินเต็มฟอร์ม
                                editorOptions: {
                                    minHeight: 80,
                                },
                                },
                            ],
                        },],
                    },
                },
                onToolbarPreparing(e) {
                    e.toolbarOptions.items.unshift({
                        location: 'before',
                        widget: 'dxSelectBox',
                        options: {
                            width: 260,
                            dataSource: eventToolbarStore,
                            valueExpr: 'eid',
                            displayExpr: 'ename',
                            placeholder: 'Select Event',

                            // เลือก event แล้วเปลี่ยน filter
                            onValueChanged(ev) {
                            currentEid = ev.value || null;
                            const grid = $(GRID_ID).dxDataGrid('instance');
                            grid.refresh();
                            },

                            // ครั้งแรก: auto เลือก eid ล่าสุด แล้วโหลดตาราง
                            onInitialized(ev) {
                            const ds = ev.component.getDataSource();
                            ds.load().done((items) => {
                                if (!items || !items.length) return;
                                const latestEid = Math.max(...items.map(i => i.eid));
                                currentEid = latestEid;
                                ev.component.option('value', latestEid);

                                const grid = $(GRID_ID).dxDataGrid('instance');
                                grid.refresh();
                            });
                            },
                        },
                    });
                },
                scrolling: {
                    mode: 'virtual',
                },
                columns: [{
                    dataField: 'eid',
                    visible: false,
                }, {
                    dataField: 'pid',
                    caption: 'Product',
                    lookup: {
                        dataSource: productStore,
                        valueExpr: 'pid',
                        displayExpr(item) {
                            if (!item) return '';
                            const { pname, category, vol, volunit, factor, subunit, unit } = item;
                            return `${pname} (ประเภท: ${category}, ${vol ?? ''} ${volunit ?? ''}, ${factor ?? ''} ${subunit ?? ''} / ${unit ?? ''})`;
                        },
                    },
                }, {
                    dataField: 'order_quantity',
                    caption: 'Order (Tray/Box)',
                    width: 150,
                }, {
                    dataField: 'order_subquantity',
                    caption: 'Order (เศษ)',
                    width: 110,
                }, {
                    dataField: 'real_quantity',
                    caption: 'Real (Tray/Box)',
                    width: 150,
                }, {
                    dataField: 'real_subquantity',
                    caption: 'Real (เศษ)',
                    width: 110,
                }, {
                    dataField: 'psdate',
                    dataType: 'date',
                    format: 'dd-MM-yyyy',
                    caption: 'Shipment',
                    width: 100,
                }, {
                    dataField: 'desc',
                    caption: 'Description',
                    width: 150,
                }, {
                    dataField: 'productSummary', 
                    visible: false
                },],
                headerFilter: {
                    visible: true,
                },
                searchPanel: {
                    visible: true,
                },
            }).dxDataGrid('instance');
        }

        function sendRequest(url, method = 'GET', data) {
            const d = $.Deferred();

            $.ajax(url, {
                method,
                data: method === 'GET' ? data : JSON.stringify(data),
                contentType: method === 'GET' ? undefined : 'application/json',
                dataType: 'json',
                cache: false,
            }).done((result) => {
                if (method === 'GET') {
                    d.resolve(result.data);
                } else {
                    d.resolve(result.data);
                }
            }).fail((xhr) => {
                console.error(xhr.responseJSON || xhr.responseText);
                d.reject(xhr.responseJSON ? xhr.responseJSON.message : xhr.statusText);
            });

            return d.promise();
        }
    </script>
</head>

<body class="dark:bg-gray-900 h-full" onload="getStart()">
    <nav
        class="relative bg-gray-800/50 after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px after:bg-white/10">

                    <!-- Mobile menu button-->
                    <button type="button" command="--toggle" commandfor="mobile-menu"
                        class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-white/5 hover:text-white focus:outline focus:outline-2 focus:-outline-offset-1 focus:outline-indigo-500">
                        <span class="absolute -inset-0.5"></span>
                        <span class="sr-only">Open main menu</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon"
                            aria-hidden="true" class="size-6 [[aria-expanded='true']_&]:hidden">
                            <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon"
                            aria-hidden="true" class="size-6 [&:not([aria-expanded='true']_*)]:hidden">
                            <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
                <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
                    <div class="flex shrink-0 items-center">
                        <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500"
                            alt="Your Company" class="h-8 w-auto" />
                    </div>

                </div>
                <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">
                    <div class="hidden sm:ml-6 sm:block">
                        <div class="flex space-x-4">
                            <!-- Current: "bg-gray-950/50 text-white", Default: "text-gray-300 hover:bg-white/5 hover:text-white" -->

                                    <a href="event.html"
                                        class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-none">Event</a>
                                    <a href="product.html"
                                        class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-none">Product</a>
                                    <a href="bar.html"
                                        class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-none">Bar</a>
                                    <a href="pre-stock.html"
                                        class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-none">Pre-Stock</a>
                                    <a href="#"
                                        class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-none">User
                                        Setting</a>
                                </el-menu>
                            </el-dropdown>
                        </div>
                    </div>
                    <!-- Profile dropdown -->
                    <el-dropdown class="relative ml-3">
                        <button
                            class="relative flex rounded-full focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">
                            <span class="absolute -inset-1.5"></span>
                            <span class="sr-only">Open user menu</span>
                            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80"
                                alt=""
                                class="size-8 rounded-full bg-gray-800 outline outline-1 -outline-offset-1 outline-white/10" />
                        </button>

                        <el-menu anchor="bottom end" popover
                            class="m-0 w-48 origin-top-right rounded-md bg-gray-800 p-0 py-1 outline outline-1 -outline-offset-1 outline-white/10 transition [--anchor-gap:theme(spacing.2)] [transition-behavior:allow-discrete] data-[closed]:scale-95 data-[closed]:transform data-[closed]:opacity-0 data-[enter]:duration-100 data-[leave]:duration-75 data-[enter]:ease-out data-[leave]:ease-in">
                            <a href="#"
                                class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-none">Your
                                profile</a>
                            <a href="#"
                                class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-none">Settings</a>
                            <a href="#"
                                class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-none">Sign
                                out</a>
                        </el-menu>
                    </el-dropdown>
                </div>
            </div>
        </div>

        <el-disclosure id="mobile-menu" hidden class="sm:hidden [&:not([hidden])]:block">
            <div class="space-y-1 px-2 pb-3 pt-2">
                <!-- Current: "bg-gray-950/50 text-white", Default: "text-gray-300 hover:bg-white/5 hover:text-white" -->
                <a href="#" aria-current="page"
                    class="block rounded-md bg-gray-950/50 px-3 py-2 text-base font-medium text-white">Dashboard</a>
                <a href="#"
                    class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white">Management</a>

                    class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white">Setup</a>
            </div>
        </el-disclosure>
    </nav>
    <header class="relative bg-gray-800">
        <div class="relative mx-auto max-w-7xl text-white px-3 sm:px-6 lg:px-8 flex h-16 items-center justify-between">
            <p class="text-2xl font-bold text-white">Setup/Pre-Stock</p>
        </div>
    </header>
    <main class="relative">
        <div class="relative mx-auto max-w-7xl text-white py-8 px-3 sm:px-6 lg:px-8">
            <div id="grid"></div>
        </div>
    </main>
</body>

</html>
