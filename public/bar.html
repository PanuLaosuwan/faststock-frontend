<!DOCTYPE html>
<html>

<head class="h-full bg-gray-900">
    <title>Faststock</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="./css/dx.material.purple.dark.css">
    <script type="text/javascript" src="./js/dx.all.js"></script>
    <script type="text/javascript">

        function getStart() {
            const URL = 'http://localhost:4000/api';

            sendRequest(`${URL}/event`).then((events) => {
                const latestEid = Math.max(...events.map(e => e.eid));

                const ordersEvent = new DevExpress.data.CustomStore({
                key: 'bid',
                load() {
                    return sendRequest(`${URL}/bars`);
                },
                insert(values) {
                    if (!values.eid && latestEid) values.eid = latestEid;
                    return sendRequest(`${URL}/bars`, 'POST', values);
                },
                update(key, values) {
                    const grid = $('#grid').dxDataGrid('instance');
                    const items = grid.getDataSource().items();
                    const oldData = items.find(row => row.bid === key);
                    const fullData = { ...oldData, ...values };
                    delete fullData.bid;
                    return sendRequest(`${URL}/bars/${key}`, 'PATCH', fullData);
                },
                remove(key) {
                    return sendRequest(`${URL}/bars/${key}`, 'DELETE');
                },
                });

                const eventLookupStore = new DevExpress.data.CustomStore({
                key: 'eid',
                load() {
                    return events;
                },
                byKey(key) {
                    return sendRequest(`${URL}/event/${key}`);
                },
                });

                const userLookupStore = new DevExpress.data.CustomStore({
                key: 'uid',
                load() {
                    return sendRequest(`${URL}/user`);
                },
                byKey(key) {
                    return sendRequest(`${URL}/user/${key}`);
                },
                });

                $('#grid').dxDataGrid({
                dataSource: ordersEvent,
                repaintChangesOnly: false,
                showBorders: true,
                editing: { refreshMode: 'reshape', mode: 'cell', allowAdding: true, allowUpdating: true, allowDeleting: true },
                scrolling: { mode: 'virtual' },

                onInitNewRow(e) {
                    if (latestEid) e.data.eid = latestEid;
                },

                columns: [{
                    dataField: 'bcode',
                    caption: 'Bar Name',
                    sortOrder: 'asc',
                    sortIndex: 0,
                }, {
                    dataField: 'uid',
                    caption: 'Head',
                    lookup: {
                    dataSource: userLookupStore,
                    valueExpr: 'uid',
                    displayExpr: 'uname',
                    },
                }, {
                    dataField: 'eid',
                    caption: 'Event',
                    filterValues: latestEid ? [latestEid] : null,   // เลือก event ล่าสุดไว้ใน header filter
                    lookup: {
                    dataSource: eventLookupStore,
                    valueExpr: 'eid',
                    displayExpr: 'ename',
                    },
                }, {
                    dataField: 'desc',
                    caption: 'Description',
                }],
                headerFilter: { visible: true },
                searchPanel: { visible: true },
                }).dxDataGrid('instance');
            });
            }



        function sendRequest(url, method = 'GET', data) {
            const d = $.Deferred();

            $.ajax(url, {
                method,
                data: method === 'GET' ? data : JSON.stringify(data),
                contentType: method === 'GET' ? undefined : 'application/json',
                dataType: 'json',
                cache: false,
            }).done((result) => {
                if (method === 'GET') {
                    d.resolve(result.data);
                } else {
                    d.resolve(result.data);
                }
            }).fail((xhr) => {
                console.error(xhr.responseJSON || xhr.responseText);
                d.reject(xhr.responseJSON ? xhr.responseJSON.message : xhr.statusText);
            });

            return d.promise();
        }
    </script>
</head>
